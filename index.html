<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einladung zu unserer Hochzeit</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
            --primary-color: #8a7356;
            --text-color: #4a4a4a;
            --accent-color: #d4af37;
            --seal-color: #a32626;
            --border-radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- VORHANG / UMSCHLAG OVERLAY --- */
        #envelope-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        .curtain-panel {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50.5%;
            background-color: #2c2927; /* Edles, dunkles Anthrazit für den Vorhang/Umschlag */
            background-image: radial-gradient(#3a3633 1px, transparent 0);
            background-size: 20px 20px;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .curtain-top {
            top: 0;
            border-bottom: 2px solid var(--accent-color);
        }

        .curtain-bottom {
            bottom: 0;
            border-top: 2px solid var(--accent-color);
        }

        /* WACHSSIEGEL */
        .wax-seal-container {
            position: absolute;
            z-index: 10000;
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s ease, opacity 0.5s ease;
        }

        .wax-seal-container:hover {
            transform: scale(1.08);
        }

        .wax-seal {
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 35% 35%, #c83232, var(--seal-color), #5e1111);
            border-radius: 50%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #801b1b;
            margin: 0 auto 15px auto;
            position: relative;
        }

        .wax-seal::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            border: 1.5px dashed rgba(255, 255, 255, 0.4);
            border-radius: 50%;
        }

        .seal-initials {
            font-family: 'Cormorant Garamond', serif;
            color: #f7e7ce;
            font-size: 2.2rem;
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }

        .seal-hint {
            color: #fdfbf7;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse 2s infinite;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        @keyframes pulse {
