<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hochzeitseinladung</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f6f3eb;
            --card-bg: #ffffff;
            --primary-color: #8a7356;
            --text-color: #4a4a4a;
            --accent-color: #d4af37;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e5dec9 1px, transparent 0);
            background-size: 24px 24px;
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- OVERLAY / ENVELOPE / VEIL --- */
        #envelope-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(246, 243, 235, 0.95);
            transition: opacity 1s ease, visibility 1s ease;
        }

        .curtain-panel {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50.5%;
            background-color: #23272a;
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 0),
                linear-gradient(to bottom, #1d2023, #2a2f33);
            background-size: 20px 20px, 100% 100%;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .curtain-top { 
            top: 0; 
            border-bottom: 2px solid var(--accent-color); 
        }

        .curtain-bottom { 
            bottom: 0; 
            border-top: 2px solid var(--accent-color); 
        }

        /* Transparenter Schleier-Effekt */
        .veil-left, .veil-right {
            position: absolute;
            top: 0;
            width: 35vw;
            height: 100%;
            background: linear-gradient(115deg, rgba(255,255,255,0.4) 0%,
